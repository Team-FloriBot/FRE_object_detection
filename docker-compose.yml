services:
  synthetic-generator:
    profiles: ["gen"] # Gehört zum Profil 'gen'
    build:
      context: .
      dockerfile: generate_synthetic/Dockerfile
    container_name: synthetic_generator
    volumes:
      - ./object_images:/app/object_images
      - ./backgrounds:/app/backgrounds
      - ./dataset:/app/dataset
    command: ["python3", "generate_synthetic.py"]

  yolo-trainer:
    profiles: ["train"] # Gehört zum Profil 'train'
    build:
      context: .
      dockerfile: training/Dockerfile
    container_name: yolo_trainer
    volumes:
      - ./dataset:/usr/src/app/dataset
      - ./model:/usr/src/app/model
      - ./training:/usr/src/app/training
      - ./runs:/usr/src/app/runs
    command: ["python3", "training/train.py"]
    gpus: all
    shm_size: '8gb'

  yolo-detector:
    profiles: ["detect"] # Gehört zum Profil 'detect'
    build:
      context: .
      dockerfile: training/Dockerfile
    container_name: yolo_detector
    volumes:
      - ./dataset:/usr/src/app/dataset
      - .:/usr/src/app
      - ./model:/model
      - ./runs:/usr/src/app/runs
    command: ["python3", "detection.py"]
    gpus: all
    shm_size: '8gb'