services:
  detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros2_detector
    gpus: all
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    networks:
      - ros2_network
    # For direct RealSense camera access (without ROS wrapper)
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /dev:/dev
    command: 
      bash -c "source /opt/ros/humble/setup.bash && source /root/ros2_ws/install/setup.bash && ros2 run ros2_detection detector_node"
    stdin_open: true
    tty: true

networks:
  ros2_network:
    driver: bridge
